<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto8 Proposals Hub</title>
<style>
  :root { --bg: #0f172a; --card: #182234; --border: #334155; --accent: #06b6d4; --text: #f8fafc; --muted: #94a3b8; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: 40px 20px; line-height: 1.6; }
  .container { max-width: 800px; margin: 0 auto; }
  .header { margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 26px; font-weight: 800; }
  h1 span { color: var(--accent); }
  .badge { background: #0284c7; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 700; }
  .proposal-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 16px; transition: transform 0.2s, border-color 0.2s; text-decoration: none; display: block; color: inherit; }
  .proposal-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .card-meta { font-size: 13px; color: var(--muted); display: flex; gap: 16px; margin-top: 8px; }
  .view-link { color: var(--accent); font-weight: 600; font-size: 14px; margin-top: 12px; display: inline-block; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Auto8 <span>Proposals Hub</span></h1>
    <div class="badge">Live Portal</div>
  </div>
  <p style="color: var(--muted); margin-bottom: 24px;">Client proposals and growth blueprints deployed by Auto8.ai.</p>
  
  <a href="/zeppelin-cleaning/" class="proposal-card">
    <div class="card-title">Zeppelin Cleaning Services</div>
    <p style="color: var(--muted); font-size: 14px;">Local SEO & Google 3-Pack Growth Roadmap (2 Locations: St. Clair Shores & Birmingham)</p>
    <div class="card-meta">
      <span>💰 $996 / mo ($498 / loc)</span>
      <span>📍 Dual Location Profile</span>
      <span>⚡ Active Proposal</span>
    </div>
    <div class="view-link">Open Proposal &rarr;</div>
  </a>
</div>
</body>
</html>
